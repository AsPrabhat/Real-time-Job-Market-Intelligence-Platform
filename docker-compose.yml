services:
  # Zookeeper - Required for Kafka coordination
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: careerradar-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - careerradar-network
    deploy:
      resources:
        limits:
          memory: 512M

  # Kafka - Message broker for streaming job data
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: careerradar-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - careerradar-network
    deploy:
      resources:
        limits:
          memory: 1G

  # Spark Master - Coordinates Spark cluster
  spark-master:
    image: apache/spark:3.5.0
    container_name: careerradar-spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"  # Spark Master Web UI
      - "7077:7077"  # Spark Master Port
    volumes:
      - ./delta-data:/opt/spark/delta
      - spark-logs:/opt/spark/logs
    networks:
      - careerradar-network
    deploy:
      resources:
        limits:
          memory: 2G

  # Spark Worker - Executes Spark tasks
  spark-worker:
    image: apache/spark:3.5.0
    container_name: careerradar-spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    volumes:
      - ./delta-data:/opt/spark/delta
      - spark-logs:/opt/spark/logs
    networks:
      - careerradar-network
    deploy:
      resources:
        limits:
          memory: 3G

  # Scraper - Loads sample data and publishes to Kafka
  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: careerradar-scraper
    depends_on:
      - kafka
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: job_postings
      SAMPLE_DATA_PATH: /data/sample_jobs.json
      BATCH_SIZE: 5
      BATCH_DELAY: 10
    volumes:
      - ./sample_data:/data
    networks:
      - careerradar-network
    deploy:
      resources:
        limits:
          memory: 256M
    restart: "no"

  # Spark Processor - Consumes from Kafka, enriches data, writes to Delta Lake
  processor:
    build:
      context: ./spark_processor
      dockerfile: Dockerfile
    container_name: careerradar-processor
    depends_on:
      - spark-master
      - spark-worker
      - kafka
    environment:
      SPARK_MASTER: spark://spark-master:7077
    volumes:
      - ./delta-data:/opt/spark/delta
    networks:
      - careerradar-network
    deploy:
      resources:
        limits:
          memory: 2G

# Named volumes for persistent data
volumes:
  spark-logs:
    driver: local

# Custom network for service communication
networks:
  careerradar-network:
    driver: bridge
